name: CI - Test & Quality Gate

on:
  push:
    branches: [ main, v2/main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Academic Platform Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Academic Platform Test Suite
        run: npm test

      - name: Verify Calendar Scraper Syntax
        run: python3 -m py_compile tools/academic_calendar_scraper.py
